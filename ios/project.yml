name: Kvitta

# Generated by XcodeGen. Never edit Kvitta.xcodeproj by hand (CLAUDE.md) — it is gitignored and
# is rebuilt from this file with `xcodegen generate`.
options:
  bundleIdPrefix: se.kvitta
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # Swedish is the reference copy (ui-design.md); English ships alongside it. The Localizable
  # String Catalog in App/ carries both localizations.
  developmentLanguage: sv

packages:
  KvittaCore:
    path: Core
  KvittaStorage:
    path: Storage
  KvittaSync:
    path: Sync
  # Crash reporting, and the only third-party dependency the app target has. It is deliberately
  # not a dependency of KvittaCore, KvittaStorage or KvittaSync: Core must stay compilable
  # anywhere with nothing installed (CLAUDE.md), and a reporter belongs at the edge that owns the
  # process, not inside the logic being reported on.
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.9.0

targets:
  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.kvitta.app.tests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen derives TEST_HOST from the target name, but the app's PRODUCT_NAME is
        # Kvitta — spell it out or the test host points at an App.app that never exists.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Kvitta.app/Kvitta
        BUNDLE_LOADER: $(TEST_HOST)

  App:
    type: application
    platform: iOS
    sources:
      - path: App
      # Apple requires this at the bundle root. Listed explicitly so it is copied as a resource
      # rather than swept up by the source glob.
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: KvittaCore
        product: KvittaCore
      - package: KvittaStorage
        product: KvittaStorage
      - package: KvittaSync
        product: KvittaSync
      - package: Sentry
        product: Sentry
    # Trial.xcconfig is gitignored and written by tools/trial-config.sh from ~/.kvitta-trial-key.
    # It carries one build setting, KVITTA_TRIAL_KEY, which lands in the Info.plist below. The
    # key is a shared gate for a friend group, not a personal credential, but the repo is public
    # and a committed key is a key for the whole internet. Run the script (trial.sh does) before
    # xcodegen; an empty file is fine and builds an app that asks for the key in Jag instead.
    configFiles:
      Debug: Trial.xcconfig
      Release: Trial.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.kvitta.app
        PRODUCT_NAME: Kvitta
        # Build 2 = multi-currency groups (M7). A build-1 client replaying a mixed-currency log
        # would skip the foreign-currency events and show wrong balances; the server's
        # MinimumClientBuild gate turns that into 426 Upgrade Required instead.
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: "0.1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The phone keeps the one-handed bottom bar; larger devices use the adaptive sidebar
        # presentation below so the same destinations remain purposeful on iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Slice
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Light appearance is intentional; keep this paired with KvittaApp's colour scheme.
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        # Signing, so it survives `xcodegen generate` — setting it in Xcode's UI does not, because
        # the .xcodeproj is regenerated from this file. Team IDs are not secret; they ship inside
        # every signed app bundle.
        DEVELOPMENT_TEAM: PMRGDMASH7
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    # Invite links arrive as kvitta://invite/<token>. A custom scheme rather than a universal
    # link because an https link needs an apple-app-site-association file served from a host that
    # does not exist until the M6 deploy. Universal links are additive later — the token format
    # and the accept endpoint do not change.
    #
    # Keep this block *after* `settings`. It was once inserted above the last two settings, which
    # silently swallowed them into the plist: the app then built as Swift 5 with strict
    # concurrency off for four merged PRs, while `swift test` stayed green because the packages
    # carry their own manifests. Nothing failed — that is exactly what made it hard to notice.
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: se.kvitta.app.invite
            CFBundleURLSchemes: [slice, kvitta]
        # Written straight into the plist rather than via INFOPLIST_KEY_UILaunchScreen_*. Those
        # settings synthesise a dictionary, and synthesising one into a plist that already exists
        # produced a nested, empty UILaunchScreen — no error, no launch screen. LaunchBackground
        # is Theme.cream, so launch and the first real frame share a background instead of the
        # app flashing white on every open.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        # Local networking only — NOT arbitrary loads. Lets a sideloaded build on a friend's
        # phone reach the dev backend over http://<mac-ip>:5142 on the same Wi-Fi (ATS blocks
        # plain http to anything but localhost otherwise). A real deploy is https and unaffected.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Crash reporting is off while this is empty, which is the state a fresh clone builds in.
        # Unlike the backend's DSN this one is not a secret and belongs in the repo: a client DSN
        # ships inside every copy of the app anyway, and it can only write, never read.
        SentryDSN: ""
        # The server every build talks to unless the Jag tab overrides it — the hosted trial on
        # Fly.io since 2026-09-06. Before this landed the default was localhost, which meant
        # every sideloaded phone had to be configured by hand before it did anything; that was
        # the right default when the only server was the one on the developer's Mac and the
        # wrong one the moment there was a real one.
        KvittaSyncBaseURL: https://slice-api.fly.dev
        # Substituted from Trial.xcconfig at build time (see configFiles on the App target).
        KvittaTrialKey: $(KVITTA_TRIAL_KEY)

name: Kvitta

# Generated by XcodeGen. Never edit Kvitta.xcodeproj by hand (CLAUDE.md) — it is gitignored and
# is rebuilt from this file with `xcodegen generate`.
options:
  bundleIdPrefix: se.kvitta
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # Swedish is the reference copy (ui-design.md); English ships alongside it. The Localizable
  # String Catalog in App/ carries both localizations.
  developmentLanguage: sv

packages:
  KvittaCore:
    path: Core
  KvittaStorage:
    path: Storage
  KvittaSync:
    path: Sync

targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
      # Apple requires this at the bundle root. Listed explicitly so it is copied as a resource
      # rather than swept up by the source glob.
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: KvittaCore
        product: KvittaCore
      - package: KvittaStorage
        product: KvittaStorage
      - package: KvittaSync
        product: KvittaSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.kvitta.app
        PRODUCT_NAME: Kvitta
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only. The zero line and the amount-first keypad are designed for one hand.
        TARGETED_DEVICE_FAMILY: 1
        INFOPLIST_KEY_CFBundleDisplayName: Kvitta
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Light only. `Theme` is a fixed warm-cream palette with no dark half, while every
        # system-drawn label — navigation titles, Form rows, TextField text — follows the system
        # appearance. On a phone in dark mode that is white text on a cream card, which is exactly
        # what the first run on real hardware turned up. This covers the UIKit surfaces
        # `preferredColorScheme` does not reach: the photo picker, the share sheet, the launch
        # screen. A real dark palette is a design exercise, not a bug fix.
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        # Signing, so it survives `xcodegen generate` — setting it in Xcode's UI does not, because
        # the .xcodeproj is regenerated from this file. Team IDs are not secret; they ship inside
        # every signed app bundle.
        DEVELOPMENT_TEAM: PMRGDMASH7
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    # Invite links arrive as kvitta://invite/<token>. A custom scheme rather than a universal
    # link because an https link needs an apple-app-site-association file served from a host that
    # does not exist until the M6 deploy. Universal links are additive later — the token format
    # and the accept endpoint do not change.
    #
    # Keep this block *after* `settings`. It was once inserted above the last two settings, which
    # silently swallowed them into the plist: the app then built as Swift 5 with strict
    # concurrency off for four merged PRs, while `swift test` stayed green because the packages
    # carry their own manifests. Nothing failed — that is exactly what made it hard to notice.
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: se.kvitta.app.invite
            CFBundleURLSchemes: [kvitta]
        # Written straight into the plist rather than via INFOPLIST_KEY_UILaunchScreen_*. Those
        # settings synthesise a dictionary, and synthesising one into a plist that already exists
        # produced a nested, empty UILaunchScreen — no error, no launch screen. LaunchBackground
        # is Theme.cream, so launch and the first real frame share a background instead of the
        # app flashing white on every open.
        UILaunchScreen:
          UIColorName: LaunchBackground

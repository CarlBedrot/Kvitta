<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Slice app icon: the pizza-slice mascot with sunglasses, from Carl's brand artwork
    (2026-08-01), redrawn as vector so the SVG stays the source of truth. Edit this file,
    never the PNG — rasterize with tools/rasterize-icon.swift.

    Palette: background is Theme cream F8F5EF; the slice is warm cheese F7CE63 with an
    E8A25C crust; pepperoni E0503C; everything outlined in the artwork's warm brown A03E14.
  -->
  <rect width="1024" height="1024" fill="#F8F5EF"/>

  <!-- Sparkles, echoing the artwork's celebration marks. -->
  <g fill="#F2B23A" stroke="#D8781F" stroke-width="10" stroke-linejoin="round">
    <path d="M 168 400 L 190 452 L 242 474 L 190 496 L 168 548 L 146 496 L 94 474 L 146 452 Z"/>
    <path d="M 862 620 L 880 662 L 922 680 L 880 698 L 862 740 L 844 698 L 802 680 L 844 662 Z"/>
  </g>
  <g stroke="#E8843B" stroke-width="22" stroke-linecap="round">
    <line x1="796" y1="176" x2="820" y2="120"/>
    <line x1="856" y1="208" x2="898" y2="164"/>
  </g>

  <!-- Cheese body: a rounded triangle, tip at the bottom. -->
  <path d="M 262 330
           C 250 306 268 288 296 292
           L 738 292
           C 766 288 784 306 772 330
           L 560 812
           C 540 858 494 858 474 812
           Z"
        fill="#F7CE63" stroke="#A03E14" stroke-width="18" stroke-linejoin="round"/>

  <!-- A cheese drip trailing off the tip. -->
  <g fill="#F7CE63" stroke="#A03E14" stroke-width="14" stroke-linejoin="round">
    <path d="M 500 836 q 4 62 -14 78 q 42 10 48 -40 Z"/>
  </g>

  <!-- Crust: a capsule across the top, with a lighter inner highlight. -->
  <rect x="216" y="178" width="592" height="140" rx="70"
        fill="#EFA75B" stroke="#A03E14" stroke-width="18"/>
  <rect x="252" y="204" width="430" height="52" rx="26" fill="#F6C288" opacity="0.85"/>

  <!-- Pepperoni, below the face. -->
  <g stroke="#A03E14" stroke-width="14">
    <circle cx="466" cy="606" r="58" fill="#E0503C"/>
    <circle cx="576" cy="652" r="48" fill="#E0503C"/>
  </g>
  <g fill="#B23225">
    <circle cx="448" cy="590" r="9"/><circle cx="488" cy="614" r="9"/><circle cx="462" cy="634" r="8"/>
    <circle cx="562" cy="638" r="8"/><circle cx="594" cy="666" r="8"/><circle cx="572" cy="678" r="7"/>
  </g>

  <!-- Sunglasses: two lenses, a bridge, and temple arms out to the slice's edges. -->
  <g stroke="#1F1B16" stroke-width="20" stroke-linecap="round">
    <line x1="330" y1="418" x2="304" y2="406"/>
    <line x1="694" y1="418" x2="732" y2="404"/>
    <line x1="486" y1="428" x2="538" y2="428"/>
  </g>
  <g fill="#26221C" stroke="#15120E" stroke-width="10">
    <rect x="330" y="382" width="160" height="104" rx="40"/>
    <rect x="534" y="382" width="160" height="104" rx="40"/>
  </g>
  <path d="M 356 408 q 40 -22 84 -8" stroke="#4A443C" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M 560 408 q 40 -22 84 -8" stroke="#4A443C" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- The smile. -->
  <path d="M 478 540 q 34 26 68 0" stroke="#1F1B16" stroke-width="16" fill="none" stroke-linecap="round"/>
</svg>
